<!DOCTYPE html>
<html lang="pt-MZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Definir palavra-passe | APG Microcrédito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/apg.css">
<script src="/assets/comum.js" defer></script>
<script src="/assets/conta-acesso.js" defer></script>
</head>
<body data-pagina="definir">
<header class="topo">
  <div class="wrap topo-linha">
    <a href="/" class="marca" aria-label="APG Microcrédito, voltar ao site"><img src="/assets/logo.png" alt="Logótipo APG Microcrédito"></a>
    <div class="topo-accoes"><a href="/">Voltar ao site</a></div>
  </div>
</header>
<main class="acesso">
  <div class="acesso-cartao">
    <h1 id="titulo">Definir palavra-passe</h1>
    <p class="desc" id="descricao">A verificar o link…</p>
    <div id="invalido" class="aviso aviso-erro" role="alert" hidden></div>
    <form id="formulario" novalidate data-publico="1" hidden>
      <div class="campo">
        <label for="palavraPasse">Nova palavra-passe</label>
        <input id="palavraPasse" name="palavraPasse" type="password" autocomplete="new-password" required minlength="8" maxlength="128">
        <p class="ajuda">Pelo menos 8 caracteres, com letras e números.</p>
      </div>
      <div class="campo">
        <label for="confirmacao">Confirmar palavra-passe</label>
        <input id="confirmacao" type="password" autocomplete="new-password" required>
      </div>
      <button type="submit" class="btn btn-gold btn-block">Guardar e entrar</button>
    </form>
    <div class="acesso-rodape"><a href="/conta/entrar">Entrar</a></div>
  </div>
</main>
</body>
</html>
